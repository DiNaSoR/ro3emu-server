syntax = "proto3";
package romsg;
import "MG_Common_Increment.proto";
import "MG_Common.proto";
import "MG_SkillGrowth.proto";

message DBSkillDataIncrement {
  message skillListRepeatedOrigin {
    repeated int32 value = 1;
  }

  message skillListRepeatedIncrement {
    repeated int32 value = 1;
  }

  message skillListFieldIncrement {
    oneof value {
      romsg.DBSkillDataIncrement.skillListRepeatedOrigin all = 1;
      romsg.DBSkillDataIncrement.skillListRepeatedIncrement inc = 2;
    }
  }

  message skillAssignPlansRepeatedOrigin {
    repeated romsg.SkillPlan value = 1;
  }

  message skillAssignPlansRepeatedIncrement {
    repeated romsg.SkillPlanIncrement value = 1;
  }

  message skillAssignPlansFieldIncrement {
    oneof value {
      romsg.DBSkillDataIncrement.skillAssignPlansRepeatedOrigin all = 1;
      romsg.DBSkillDataIncrement.skillAssignPlansRepeatedIncrement inc = 2;
    }
  }

  message skillWheelFieldIncrement {
    oneof value {
      romsg.SkillWheel all = 1;
      romsg.SkillWheelIncrement inc = 2;
    }
  }

  message originSkillWheelFieldIncrement {
    oneof value {
      romsg.SkillWheel all = 1;
      romsg.SkillWheelIncrement inc = 2;
    }
  }

  int64 version = 1;
  bool syncAllMark = 2;
  optional int32 maxPlanCount = 10;
  optional int32 currentPlanIndex = 20;
  romsg.DBSkillDataIncrement.skillListFieldIncrement skillList = 30;
  romsg.DBSkillDataIncrement.skillAssignPlansFieldIncrement skillAssignPlans = 40;
  optional int32 currentAtkSkillId = 50;
  romsg.DBSkillDataIncrement.skillWheelFieldIncrement skillWheel = 60;
  optional bytes skillCdData = 70;
  romsg.DBSkillDataIncrement.originSkillWheelFieldIncrement originSkillWheel = 80;
}

message SkillDataIncrement {
  optional int32 skillId = 10;
  optional int32 skillLevel = 20;
}

message SkillPlanIncrement {
  message skillAssignsFieldIncrement {
    oneof value {
      romsg.SkillData all = 1;
      romsg.SkillDataIncrement inc = 2;
      bool del = 3;
    }
  }

  message manualLoadSkillRepeatedOrigin {
    repeated romsg.SkillData value = 1;
  }

  message manualLoadSkillRepeatedIncrement {
    repeated romsg.SkillDataIncrement value = 1;
  }

  message manualLoadSkillFieldIncrement {
    oneof value {
      romsg.SkillPlanIncrement.manualLoadSkillRepeatedOrigin all = 1;
      romsg.SkillPlanIncrement.manualLoadSkillRepeatedIncrement inc = 2;
    }
  }

  message autoLoadSkillRepeatedOrigin {
    repeated romsg.SkillData value = 1;
  }

  message autoLoadSkillRepeatedIncrement {
    repeated romsg.SkillDataIncrement value = 1;
  }

  message autoLoadSkillFieldIncrement {
    oneof value {
      romsg.SkillPlanIncrement.autoLoadSkillRepeatedOrigin all = 1;
      romsg.SkillPlanIncrement.autoLoadSkillRepeatedIncrement inc = 2;
    }
  }

  message skillQueueFieldIncrement {
    oneof value {
      romsg.SkillData all = 1;
      romsg.SkillDataIncrement inc = 2;
      bool del = 3;
    }
  }

  message powerFieldIncrement {
    oneof value {
      romsg.PowerUnit all = 1;
      romsg.PowerUnitIncrement inc = 2;
    }
  }

  message skillPointsFieldIncrement {
    oneof value {
      int32 all = 1;
      int32 inc = 2;
      bool del = 3;
    }
  }

  optional bool isUnlock = 10;
  map<int32, romsg.SkillPlanIncrement.skillAssignsFieldIncrement> skillAssigns = 20;
  romsg.SkillPlanIncrement.manualLoadSkillFieldIncrement manualLoadSkill = 30;
  romsg.SkillPlanIncrement.autoLoadSkillFieldIncrement autoLoadSkill = 40;
  map<int32, romsg.SkillPlanIncrement.skillQueueFieldIncrement> skillQueue = 50;
  optional string name = 60;
  romsg.SkillPlanIncrement.powerFieldIncrement power = 70;
  optional int32 skillGenre = 80;
  map<int32, romsg.SkillPlanIncrement.skillPointsFieldIncrement> skillPoints = 90;
}

message SkillWheelIncrement {
  message whellSkillsFieldIncrement {
    oneof value {
      romsg.SkillWheelSlot all = 1;
      romsg.SkillWheelSlotIncrement inc = 2;
      bool del = 3;
    }
  }

  message skillQueueFieldIncrement {
    oneof value {
      romsg.SkillWheelSlot all = 1;
      romsg.SkillWheelSlotIncrement inc = 2;
    }
  }

  message petSkillFieldIncrement {
    oneof value {
      romsg.SkillWheelSlot all = 1;
      romsg.SkillWheelSlotIncrement inc = 2;
    }
  }

  message dungeonSkillsFieldIncrement {
    oneof value {
      romsg.SkillWheelSlot all = 1;
      romsg.SkillWheelSlotIncrement inc = 2;
      bool del = 3;
    }
  }

  map<int32, romsg.SkillWheelIncrement.whellSkillsFieldIncrement> whellSkills = 10;
  optional int32 atkSkillId = 20;
  romsg.SkillWheelIncrement.skillQueueFieldIncrement skillQueue = 30;
  romsg.SkillWheelIncrement.petSkillFieldIncrement petSkill = 40;
  map<int32, romsg.SkillWheelIncrement.dungeonSkillsFieldIncrement> dungeonSkills = 50;
}

message SkillWheelSlotIncrement {
  optional int32 skillConfigId = 10;
  optional bool enable = 20;
  optional bool isHighlight = 30;
  optional bool isInteraction = 40;
  optional romsg.ESkillDisableReason disableReason = 50;
  optional int64 highlightEndTimeMs = 60;
  optional int32 mode = 70;
}

