syntax = "proto3";
package romsg;
import "MG_Common_Increment.proto";
import "MG_Common.proto";

message BondsInfoIncrement {
  message cardListFieldIncrement {
    oneof value {
      romsg.ItemBaseInfo all = 1;
      romsg.ItemBaseInfoIncrement inc = 2;
      bool del = 3;
    }
  }

  optional int32 entryId = 10;
  map<int32, romsg.BondsInfoIncrement.cardListFieldIncrement> cardList = 20;
}

