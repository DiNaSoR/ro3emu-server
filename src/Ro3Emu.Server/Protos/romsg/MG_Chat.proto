syntax = "proto3";
package romsg;
import "MG_Common.proto";

enum BroadCastType {
  BROADCAST_TYPE_MIN = 0;
  BROADCAST_TYPE_SYSTEM = 1;
  BROADCAST_TYPE_MARQUEE = 2;
  BROADCAST_TYPE_BATTLE = 3;
  BROADCAST_TYPE_MAX = 4;
}

enum ViewGroupType {
  VIEWGROUP_TYPE_MIN = 0;
  VIEWGROUP_TYPE_GUILD = 1;
  VIEWGROUP_TYPE_GVG_BATTLE = 2;
  VIEWGROUP_TYPE_GVG_CASTLE = 3;
  VIEWGROUP_TYPE_MAX = 4;
}

enum ChatChannelType {
  CHATCHANNEL_TYPE_MIN = 0;
  CHATCHANNEL_TYPE_WORLD = 1;
  CHATCHANNEL_TYPE_GUILD = 2;
  CHATCHANNEL_TYPE_TEAM = 3;
  CHATCHANNEL_TYPE_NEARBY = 4;
  CHATCHANNEL_TYPE_SECRETCHAT = 5;
  CHATCHANNEL_TYPE_SCHOOL = 6;
  CHATCHANNEL_TYPE_TREEHOLE = 7;
  CHATCHANNEL_TYPE_RECRUIT = 8;
  CHATCHANNEL_TYPE_SYSTEM = 9;
  CHATCHANNEL_TYPE_BARROOM = 10;
  CHATCHANNEL_TYPE_TOPLUXURY = 11;
  CHATCHANNEL_TYPE_MAX = 12;
}

enum SendMsgType {
  ChatNone = 0;
  PrivateChat = 1;
  ChannelChat = 2;
}

enum ServerChatTemplate {
  CHAT_TEMPLATE_NONE = 0;
  CHAT_TEMPLATE_RECRUIT = 1;
  CHAT_TEMPLATE_SOUNDTRANSMISSION = 2;
  CHAT_TEMPLATE_DUNGEONCLEAR = 3;
  CHAT_TEMPLATE_ITEMSHARE = 4;
  CHAT_TEMPLATE_NORMAL = 5;
  CHAT_TEMPLATE_LOCATIONSHARE = 6;
  CHAT_TEMPLATE_MENTIONED = 7;
  CHAT_TEMPLATE_CREATE_HELPER = 100;
  CHAT_TEMPLATE_GUILD_RECRUIT = 101;
  CHAT_TEMPLATE_ELITE_TEAM = 102;
  CHAT_TEMPLATE_ADVENTUREGROUP = 103;
}

enum ChatParamType {
  CHAT_PARAM_STRING = 0;
  CHAT_PARAM_TENBOSS = 1;
  CHAT_PARAM_STRING_LIST = 2;
  CHAT_PARAM_ITEM = 3;
  CHAT_PARAM_NPC_NAME = 4;
  CHAT_PARAM_INT64_LIST = 5;
  CHAT_PARAM_MAP = 6;
  CHAT_PARAM_INT64 = 7;
  CHAT_PARAM_TYPE = 8;
  CHAT_PARAM_PLAYER_ID = 9;
  CHAT_PARAM_PLAYER_CAMP = 10;
  CHAT_PARAM_NPC_ICON = 11;
  CHAT_PARAM_NPC_POINT_ICON = 12;
  CHAT_PARAM_NPC_CAMP = 13;
  CHAT_PARAM_PLAYER_NAME_CAMP = 14;
  CHAT_PARAM_GUILD_PICTRUE_NAME = 15;
  CHAT_PARAM_GUILD_AREA_ID = 16;
  CHAT_PARAM_MESSAGE_COUNTDOWN = 17;
  CHAT_PARAM_GATHER = 18;
  CHAT_PARAM_MAP_LIST = 19;
  CHAT_PARAM_CAMPFIRE_SHOW = 20;
  CHAT_PARAM_LIFEJOB_GAME = 21;
  CHAT_PARAM_GUILD_OFFICIAL = 22;
  CHAT_PARAM_CAMPFIRE_AFFIX_ID = 23;
  CHAT_PARAM_ONEPIECE_SCENELINE = 24;
  CHAT_PARAM_TIMESTAMP = 25;
  CHAT_PARAM_WORLD_POSITION = 26;
  CHAT_PARAM_PLAYER_PLACEHOLDER = 27;
  CHAT_PARAM_PLAYER_NAME = 28;
}

message CommonLinkInfo {
  int32 templateId = 1;
  string commonData = 2;
}

message SoundTransmission {
  string playerName = 1;
  string words = 2;
}

message DungeonClearBroadCast {
  string teamLeaderName = 1;
  int32 bossId = 2;
  repeated string playerName = 3;
}

message FriendGiftBroadCastInfo {
  string playerName = 1;
  string words = 2;
  int64 itemId = 3;
  string targetName = 4;
  int32 count = 5;
}

message NormalExtraData {
  int32 iChannelIndex = 1;
  bool bIsExposed = 2;
  bool bIsCopy = 3;
  romsg.SendMsgType eChatType = 4;
  uint64 iRoleId = 5;
  int32 iUiWordTemplate = 6;
}

message SingleShareItemLinkData {
  string itemName = 1;
  int32 itemId = 2;
  uint64 instanceId = 3;
  string itemDataJsonStr = 4;
  int32 startIndex = 5;
  int32 endIndex = 6;
  romsg.ServerChatTemplate type = 7;
}

message AllShareItemData {
  int32 channelIndex = 1;
  romsg.SendMsgType sendType = 2;
  uint64 senderId = 3;
  repeated romsg.SingleShareItemLinkData data = 4;
}

message LocationLinkData {
  string content = 1;
  int32 mapId = 2;
  int32 x = 3;
  int32 y = 4;
  int32 z = 5;
  int32 startIndex = 6;
  int32 endIndex = 7;
  romsg.ServerChatTemplate type = 8;
}

message MentionedLinkData {
  uint64 replyTargetId = 1;
  int32 replyChannelIndex = 2;
  int32 startIndex = 3;
  int32 endIndex = 4;
  romsg.ServerChatTemplate type = 5;
}

message GuildToolPermissionCastInfo {
  romsg.WartimeToolType wartimeToolType = 1;
}

message BattleShoutInfo {
  string playerName = 1;
  int64 npcCfgID = 2;
}

message GuildCampFireAddAccelerant {
  string playerName = 1;
}

message GuildCampFireLuckyPlayer {
  repeated string playerName = 1;
  int32 level = 2;
}

message GuildCampFireBossKiller {
  string playerName = 1;
}

message MvpKillerNotify {
  int64 mvpId = 1;
  string playerName = 2;
}

message MvpRefreshNotify {
  int32 mvpId = 1;
  int64 mapId = 2;
}

message NpcShoutInfo {
  int64 npcConfigId = 1;
  int32 npcPointId = 2;
  int64 mapId = 3;
  int64 npcEntityId = 4;
  int64 npcCampIndex = 5;
  int64 TargetId = 6;
  int32 TargetCamp = 7;
}

message MapShoutInfo {
  int32 mapId = 1;
  int64 mapEntityId = 2;
  int32 stage = 3;
}

message PlayerShoutInfo {
  int64 playerId = 1;
  int32 playerCamp = 2;
  int64 targetId = 3;
  int32 TargetCamp = 4;
}

message GuildCustomizeInfo {
  int64 guildId = 1;
  string guildName = 2;
  int32 level = 3;
  int32 joinLevelLimit = 4;
  string content = 5;
  romsg.GuildHeadIcon headIcon = 6;
  int32 helperCount = 7;
  int32 helperMaxCount = 8;
  int64 playerId = 9;
  string memberName = 10;
  int32 official = 11;
  int64 teamId = 12;
  string memberName2 = 13;
}

message AdventureGroupCustomizeInfo {
  int64 token = 1;
  string playerName = 2;
  string adventGroupName = 3;
}

message ChatCustomizeDada {
  romsg.SoundTransmission soundTransmission = 1;
  romsg.DungeonClearBroadCast dungeonClearData = 2;
  romsg.FriendGiftBroadCastInfo friendGiftData = 3;
  romsg.DungeonGatherData dupgeonGatherData = 4;
  romsg.GuildToolPermissionCastInfo guildToolPermissionCastInfo = 5;
  repeated int64 intParams = 6;
  romsg.BattleShoutInfo battleInfo = 7;
  romsg.TreasureBossInfo treasureBoss = 8;
  romsg.GuildCampFireAddAccelerant addAccelerantInfo = 9;
  romsg.GuildCampFireLuckyPlayer luckyPlayerInfo = 10;
  romsg.GuildCampFireBossKiller bossKiller = 11;
  romsg.LanguageData params = 12;
  romsg.MvpRefreshNotify mvpRefresh = 13;
  romsg.MvpKillerNotify mvpKiller = 14;
  romsg.AuctionSucceedInfo auctionSucceedInfo = 15;
  romsg.NpcShoutInfo npcShoutInfo = 16;
  romsg.MapShoutInfo mapShoutInfo = 17;
  romsg.PlayerShoutInfo playerShoutInfo = 18;
  romsg.OnePieceMapBroadCast onePieceBoardCast = 19;
  romsg.GuildCustomizeInfo guildCustomizeData = 20;
  romsg.AdventureGroupCustomizeInfo adventGroupData = 21;
}

message OnePieceMapBroadCast {
  repeated int32 mapIds = 1;
}

message AuctionSucceedInfo {
  string playerName = 1;
  int64 itemId = 2;
}

message TreasureBossInfo {
  string playerName = 1;
  int32 mapId = 2;
}

message ChatParameter {
  repeated string params = 1;
  romsg.ChatParamType type = 2;
}

message IMSDKUserSigReq {
}

message IMSDKUserSigRsp {
  int32 result = 1;
  string userSig = 2;
  int32 sdkAppID = 3;
  int64 expireTime = 4;
}

message JoinChatChannelReq {
  string groupId = 1;
}

message JoinChatChannelRsp {
  int32 result = 1;
  romsg.JoinChatChannelReq req = 2;
}

message MutePlayerInChannelNotify {
  string chatChannelGroupId = 1;
  bool isMute = 2;
}

