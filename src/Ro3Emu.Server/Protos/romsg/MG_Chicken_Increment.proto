syntax = "proto3";
package romsg;

message ChickenDungeonInfoIncrement {
  message skillsFieldIncrement {
    oneof value {
      int64 all = 1;
      int64 inc = 2;
      bool del = 3;
    }
  }

  message itemsFieldIncrement {
    oneof value {
      int32 all = 1;
      int32 inc = 2;
      bool del = 3;
    }
  }

  message equipsFieldIncrement {
    oneof value {
      int64 all = 1;
      int64 inc = 2;
      bool del = 3;
    }
  }

  message identityCardsFieldIncrement {
    oneof value {
      int64 all = 1;
      int64 inc = 2;
      bool del = 3;
    }
  }

  optional int64 chickenOpenTime = 10;
  map<int32, romsg.ChickenDungeonInfoIncrement.skillsFieldIncrement> skills = 20;
  map<int32, romsg.ChickenDungeonInfoIncrement.itemsFieldIncrement> items = 30;
  map<int32, romsg.ChickenDungeonInfoIncrement.equipsFieldIncrement> equips = 40;
  map<int64, romsg.ChickenDungeonInfoIncrement.identityCardsFieldIncrement> identityCards = 50;
}

