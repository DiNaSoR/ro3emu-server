syntax = "proto3";
package romsg;
import "MG_Common_Increment.proto";
import "MG_Common.proto";
import "MG_TransAction.proto";

message ActionOneStepIncrement {
  message resourceOperateRepeatedOrigin {
    repeated romsg.ResourceOperate value = 1;
  }

  message resourceOperateRepeatedIncrement {
    repeated romsg.ResourceOperateIncrement value = 1;
  }

  message resourceOperateFieldIncrement {
    oneof value {
      romsg.ActionOneStepIncrement.resourceOperateRepeatedOrigin all = 1;
      romsg.ActionOneStepIncrement.resourceOperateRepeatedIncrement inc = 2;
    }
  }

  optional string actionName = 10;
  romsg.ActionOneStepIncrement.resourceOperateFieldIncrement resourceOperate = 20;
  optional string checkParam = 30;
}

message BuyTransActionIncrement {
  message transactionFieldIncrement {
    oneof value {
      romsg.TransAction all = 1;
      romsg.TransActionIncrement inc = 2;
    }
  }

  romsg.BuyTransActionIncrement.transactionFieldIncrement transaction = 10;
}

message ResourceOperateIncrement {
  message itemRepeatedOrigin {
    repeated romsg.ItemBaseInfo value = 1;
  }

  message itemRepeatedIncrement {
    repeated romsg.ItemBaseInfoIncrement value = 1;
  }

  message itemFieldIncrement {
    oneof value {
      romsg.ResourceOperateIncrement.itemRepeatedOrigin all = 1;
      romsg.ResourceOperateIncrement.itemRepeatedIncrement inc = 2;
    }
  }

  romsg.ResourceOperateIncrement.itemFieldIncrement item = 10;
  optional int64 tarPlayerId = 20;
}

message SaleTransActionIncrement {
  message transactionFieldIncrement {
    oneof value {
      romsg.TransAction all = 1;
      romsg.TransActionIncrement inc = 2;
    }
  }

  romsg.SaleTransActionIncrement.transactionFieldIncrement transaction = 10;
}

message TransActionIncrement {
  message stepsRepeatedOrigin {
    repeated romsg.ActionOneStep value = 1;
  }

  message stepsRepeatedIncrement {
    repeated romsg.ActionOneStepIncrement value = 1;
  }

  message stepsFieldIncrement {
    oneof value {
      romsg.TransActionIncrement.stepsRepeatedOrigin all = 1;
      romsg.TransActionIncrement.stepsRepeatedIncrement inc = 2;
    }
  }

  optional string transActionId = 10;
  optional string name = 20;
  romsg.TransActionIncrement.stepsFieldIncrement steps = 30;
  optional int64 ownerRoleID = 40;
}

