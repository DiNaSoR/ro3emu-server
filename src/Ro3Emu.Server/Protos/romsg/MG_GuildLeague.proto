syntax = "proto3";
package romsg;
import "MG_Common.proto";
import "MG_Guild.proto";

enum GuildLeagueStatus {
  GuildLeagueStatus_None = 0;
  GuildLeagueStatus_NotOpen = 1;
  GuildLeagueStatus_Init = 2;
  GuildLeagueStatus_FightOne = 3;
  GuildLeagueStatus_FightTwo = 4;
  GuildLeagueStatus_FightThree = 5;
  GuildLeagueStatus_Reward = 6;
}

enum GuildLeagueResult {
  GuildLeagueResult_BlueWin = 0;
  GuildLeagueResult_RedWin = 1;
}

message LeagueActivityInfo {
  bool open = 1;
  int64 startTime = 2;
  int64 endTime = 3;
  romsg.GuildLeagueStatus eStatus = 4;
  int64 initTime = 5;
  int64 preliminaryTime = 7;
  int64 semiFinalTime = 8;
  int64 finalTime = 9;
  string errMsg = 10;
  int32 index = 11;
  int64 nextPreliminaryTime = 12;
  int64 preliminaryEndTime = 13;
  int64 semiFinalEndTime = 14;
  int64 finalEndTime = 15;
  reserved 6 to 6;
}

message GuildLeagueMatchPair {
  int64 blueGuildId = 1;
  int64 redGuildId = 2;
}

message GuildLeagueGuildMatchInfo {
  int64 guildID = 1;
  int64 power = 2;
  int32 rank = 3;
  int32 rankOrder = 4;
  int32 matcharea = 5;
  int32 score = 6;
  romsg.GuildLeagueRankLift rankLift = 7;
}

message GuildLeagueMatchGroupInfo {
  int64 rank = 1;
  int64 rankorder = 2;
  repeated romsg.GuildLeagueGuildMatchInfo guildData = 3;
  repeated romsg.GuildLeagueMatchPair matchpair = 4;
  repeated romsg.LeagueResultInfo resultInfo = 5;
  repeated romsg.GuildLeagueMatchPair preliMatchpair = 6;
}

message GuildLeagueGuildInfo {
  int64 guildID = 1;
  int64 power = 2;
  string name = 3;
  romsg.GuildHeadIcon icon = 4;
  int32 memberCount = 5;
  int32 guildWeekActivity = 6;
  int32 WarnNum = 7;
  bool del = 8;
  int32 areaId = 9;
  romsg.GuildHistoryHonor honor = 10;
}

message GuildSceneDungeonMap {
  map<int64, int64> dungeonSceneMap = 1;
}

message GuildLeagueTotalInfo {
  romsg.LeagueActivityInfo activityInfo = 1;
  repeated romsg.GuildLeagueMatchGroupInfo matchInfo = 2;
  repeated romsg.GuildLeagueGuildInfo guildInfo = 3;
  map<int64, romsg.GuildSceneDungeonMap> guildSceneMap = 4;
}

message GetGuildLeagueMgrDataReq {
  int64 playerid = 1;
  int64 guildId = 2;
}

message GetGuildLeagueMgrDataRsp {
  int32 result = 1;
  romsg.GuildLeagueGuildDungeonData myGuildInfo = 2;
  repeated romsg.GuildLeagueGuildDungeonData rankGuildInfo = 3;
  romsg.LeagueActivityInfo activityInfo = 4;
}

message GetGuildLeagueInfoReq {
  int64 playerid = 1;
}

message GetGuildLeagueInfoRsp {
  int32 result = 1;
  romsg.GuildLeagueInfo info = 2;
}

message GuildLeagueMatchInfo {
  romsg.GuildLeagueGuildDungeonData blueGuild = 1;
  romsg.GuildLeagueGuildDungeonData redGuild = 2;
}

message GetGuildLeagueGroupInfoReq {
  int64 playerid = 1;
  int64 guildId = 2;
}

message GetGuildLeagueGroupInfoRsp {
  int32 result = 1;
  romsg.GuildLeagueStatus eStatus = 2;
  repeated romsg.GuildLeagueMatchInfo info = 3;
}

message GuildLeagueInitStr {
  romsg.GuildLeagueMatchInfo info = 1;
  int32 curStage = 2;
}

message SyncPlayerGuildLeagueDungeonNtf {
  romsg.GuildLeagueMatchInfo info = 1;
}

message GuildLeagueDungeonResultNtf {
  int32 result = 1;
  romsg.GuildLeagueHistory history = 2;
}

message GetGuildLeagueGuildInfoResp {
  int32 result = 1;
  repeated romsg.GuildLeagueGuildInfo infoList = 2;
  bool retry = 3;
}

message SyncGuildLeagueGuildChangeReq {
  int64 guildId = 1;
  bool removeGuild = 2;
  repeated romsg.GuildLeagueGuildInfo changeInfoList = 3;
}

message GuildLeagueBattlePointTitleParam {
  int32 intValue = 1;
  string stringValue = 2;
}

message GuildLeagueBattlePointTitleNtf {
  int32 titleId = 1;
  repeated romsg.GuildLeagueBattlePointTitleParam paramList = 2;
  int64 playerGuid = 3;
}

message GuildLeagueEventNtf {
  int32 eventID = 1;
  int64 id = 2;
}

message GmGuildLeagueStateNotify {
  bool IsOpen = 1;
}

