syntax = "proto3";
package romsg;
import "MG_FlyingDragon.proto";

message DBCeremonyInfoIncrement {
  message ThumbsUpRolesFieldIncrement {
    oneof value {
      bool all = 1;
      bool inc = 2;
      bool del = 3;
    }
  }

  optional bool CanThumbsUp = 10;
  optional int64 ThumbsUpEndTimeStamp = 20;
  map<int64, romsg.DBCeremonyInfoIncrement.ThumbsUpRolesFieldIncrement> ThumbsUpRoles = 30;
  optional int64 CeremonyStartTime = 40;
}

message DBFlyingDragonProduceInfoIncrement {
  message productInfoFieldIncrement {
    oneof value {
      romsg.DBProductInfo all = 1;
      romsg.DBProductInfoIncrement inc = 2;
    }
  }

  message ceremonyInfoFieldIncrement {
    oneof value {
      romsg.DBCeremonyInfo all = 1;
      romsg.DBCeremonyInfoIncrement inc = 2;
    }
  }

  message StartRolesFieldIncrement {
    oneof value {
      int64 all = 1;
      int64 inc = 2;
      bool del = 3;
    }
  }

  romsg.DBFlyingDragonProduceInfoIncrement.productInfoFieldIncrement productInfo = 10;
  romsg.DBFlyingDragonProduceInfoIncrement.ceremonyInfoFieldIncrement ceremonyInfo = 20;
  optional int64 ProcessUniqueId = 30;
  optional int64 OwnerRoleId = 40;
  map<int64, romsg.DBFlyingDragonProduceInfoIncrement.StartRolesFieldIncrement> StartRoles = 50;
}

message DBProductInfoIncrement {
  message AssistantRolesFieldIncrement {
    oneof value {
      bool all = 1;
      bool inc = 2;
      bool del = 3;
    }
  }

  message OriItemsFieldIncrement {
    oneof value {
      int32 all = 1;
      int32 inc = 2;
      bool del = 3;
    }
  }

  optional int32 ReleaseProgress = 10;
  optional int64 ProcessEndTimeStamp = 20;
  map<int64, romsg.DBProductInfoIncrement.AssistantRolesFieldIncrement> AssistantRoles = 30;
  optional int32 ExtraRewardIndex = 40;
  map<int32, romsg.DBProductInfoIncrement.OriItemsFieldIncrement> OriItems = 50;
  optional bool HasSelfAccelerate = 60;
}

