syntax = "proto3";
package romsg;
import "MG_Common_Increment.proto";
import "MG_Common.proto";
import "MG_Guild_Increment.proto";
import "MG_Guild.proto";
import "MG_Siege.proto";

message SiegeCityBattleInfoIncrement {
  message attackGuildInfoFieldIncrement {
    oneof value {
      romsg.GuildSnapInfo all = 1;
      romsg.GuildSnapInfoIncrement inc = 2;
    }
  }

  message defenseGuildInfoFieldIncrement {
    oneof value {
      romsg.GuildSnapInfo all = 1;
      romsg.GuildSnapInfoIncrement inc = 2;
    }
  }

  optional int32 cityId = 10;
  romsg.SiegeCityBattleInfoIncrement.attackGuildInfoFieldIncrement attackGuildInfo = 20;
  romsg.SiegeCityBattleInfoIncrement.defenseGuildInfoFieldIncrement defenseGuildInfo = 30;
  optional int64 startTime = 40;
  optional int64 endTime = 50;
  optional romsg.SiegeCityActivityState activityState = 60;
}

message SiegeCityHistoryInfoIncrement {
  message siegeWinInfoFieldIncrement {
    oneof value {
      int32 all = 1;
      int32 inc = 2;
      bool del = 3;
    }
  }

  message guildInfoFieldIncrement {
    oneof value {
      romsg.GuildSnapInfo all = 1;
      romsg.GuildSnapInfoIncrement inc = 2;
    }
  }

  message battleInfoFieldIncrement {
    oneof value {
      romsg.SiegeHistoryBattleInfo all = 1;
      romsg.SiegeHistoryBattleInfoIncrement inc = 2;
    }
  }

  optional int32 cityId = 10;
  optional int32 week = 20;
  map<int32, romsg.SiegeCityHistoryInfoIncrement.siegeWinInfoFieldIncrement> siegeWinInfo = 30;
  romsg.SiegeCityHistoryInfoIncrement.guildInfoFieldIncrement guildInfo = 40;
  romsg.SiegeCityHistoryInfoIncrement.battleInfoFieldIncrement battleInfo = 50;
}

message SiegeCityHistoryInfoListIncrement {
  message infosRepeatedOrigin {
    repeated romsg.SiegeCityHistoryInfo value = 1;
  }

  message infosRepeatedIncrement {
    repeated romsg.SiegeCityHistoryInfoIncrement value = 1;
  }

  message infosFieldIncrement {
    oneof value {
      romsg.SiegeCityHistoryInfoListIncrement.infosRepeatedOrigin all = 1;
      romsg.SiegeCityHistoryInfoListIncrement.infosRepeatedIncrement inc = 2;
    }
  }

  romsg.SiegeCityHistoryInfoListIncrement.infosFieldIncrement infos = 10;
}

message SiegeEntityTotalInfoIncrement {
  message battleInfosFieldIncrement {
    oneof value {
      romsg.SiegeCityBattleInfo all = 1;
      romsg.SiegeCityBattleInfoIncrement inc = 2;
      bool del = 3;
    }
  }

  message cityHistoryInfoFieldIncrement {
    oneof value {
      romsg.SiegeCityHistoryInfoList all = 1;
      romsg.SiegeCityHistoryInfoListIncrement inc = 2;
      bool del = 3;
    }
  }

  message guildSceneMapFieldIncrement {
    oneof value {
      int64 all = 1;
      int64 inc = 2;
      bool del = 3;
    }
  }

  map<int32, romsg.SiegeEntityTotalInfoIncrement.battleInfosFieldIncrement> battleInfos = 10;
  map<int32, romsg.SiegeEntityTotalInfoIncrement.cityHistoryInfoFieldIncrement> cityHistoryInfo = 20;
  optional int32 week = 30;
  map<int64, romsg.SiegeEntityTotalInfoIncrement.guildSceneMapFieldIncrement> guildSceneMap = 40;
}

message SiegeHistoryBattleInfoIncrement {
  message resultInfoFieldIncrement {
    oneof value {
      romsg.SiegeResultInfo all = 1;
      romsg.SiegeResultInfoIncrement inc = 2;
    }
  }

  message commonResultInfoFieldIncrement {
    oneof value {
      romsg.DungeonResultInfo all = 1;
      romsg.DungeonResultInfoIncrement inc = 2;
    }
  }

  romsg.SiegeHistoryBattleInfoIncrement.resultInfoFieldIncrement resultInfo = 10;
  romsg.SiegeHistoryBattleInfoIncrement.commonResultInfoFieldIncrement commonResultInfo = 20;
}

message SiegeResultInfoIncrement {
  message winGuildInfoFieldIncrement {
    oneof value {
      romsg.GuildSnapInfo all = 1;
      romsg.GuildSnapInfoIncrement inc = 2;
    }
  }

  message loseGuildInfoFieldIncrement {
    oneof value {
      romsg.GuildSnapInfo all = 1;
      romsg.GuildSnapInfoIncrement inc = 2;
    }
  }

  optional int32 result = 10;
  optional int64 time = 20;
  romsg.SiegeResultInfoIncrement.winGuildInfoFieldIncrement winGuildInfo = 30;
  romsg.SiegeResultInfoIncrement.loseGuildInfoFieldIncrement loseGuildInfo = 40;
}

