syntax = "proto3";
package romsg;
import "MG_GuildVoiceChannel.proto";

message GuildVoiceAllDataIncrement {
  message voiceChannelsFieldIncrement {
    oneof value {
      romsg.GuildVoiceChannelData all = 1;
      romsg.GuildVoiceChannelDataIncrement inc = 2;
      bool del = 3;
    }
  }

  message memberVoiceStatesFieldIncrement {
    oneof value {
      romsg.GuildVoiceInviteState all = 1;
      romsg.GuildVoiceInviteStateIncrement inc = 2;
      bool del = 3;
    }
  }

  map<int32, romsg.GuildVoiceAllDataIncrement.voiceChannelsFieldIncrement> voiceChannels = 10;
  map<int64, romsg.GuildVoiceAllDataIncrement.memberVoiceStatesFieldIncrement> memberVoiceStates = 20;
}

message GuildVoiceApplyInfoIncrement {
  optional int64 playerId = 10;
  optional string reason = 20;
  optional int64 applyTime = 30;
}

message GuildVoiceChannelDataIncrement {
  message blackListFieldIncrement {
    oneof value {
      int64 all = 1;
      int64 inc = 2;
      bool del = 3;
    }
  }

  message currentMembersFieldIncrement {
    oneof value {
      romsg.GuildVoiceChannelMemberData all = 1;
      romsg.GuildVoiceChannelMemberDataIncrement inc = 2;
      bool del = 3;
    }
  }

  message speakerListRepeatedOrigin {
    repeated int64 value = 1;
  }

  message speakerListRepeatedIncrement {
    repeated int64 value = 1;
  }

  message speakerListFieldIncrement {
    oneof value {
      romsg.GuildVoiceChannelDataIncrement.speakerListRepeatedOrigin all = 1;
      romsg.GuildVoiceChannelDataIncrement.speakerListRepeatedIncrement inc = 2;
    }
  }

  message applyListFieldIncrement {
    oneof value {
      romsg.GuildVoiceApplyInfo all = 1;
      romsg.GuildVoiceApplyInfoIncrement inc = 2;
      bool del = 3;
    }
  }

  optional int32 channelIndex = 10;
  map<int64, romsg.GuildVoiceChannelDataIncrement.blackListFieldIncrement> blackList = 20;
  map<int64, romsg.GuildVoiceChannelDataIncrement.currentMembersFieldIncrement> currentMembers = 30;
  optional romsg.GuildSpeakAuthorityType speakMode = 40;
  romsg.GuildVoiceChannelDataIncrement.speakerListFieldIncrement speakerList = 50;
  map<int64, romsg.GuildVoiceChannelDataIncrement.applyListFieldIncrement> applyList = 60;
  optional int64 createTime = 70;
}

message GuildVoiceChannelMemberDataIncrement {
  optional int64 playerId = 10;
  optional int64 joinTime = 20;
}

message GuildVoiceInviteStateIncrement {
  optional int64 playerId = 10;
  optional int64 lastInviteTime = 30;
  optional int64 rejectInviteUntil = 40;
}

