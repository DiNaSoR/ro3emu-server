syntax = "proto3";
package romsg;
import "MG_Common_Increment.proto";
import "MG_Common.proto";
import "MG_Stalls.proto";

message DBPlayerStallsInfoIncrement {
  message infoFieldIncrement {
    oneof value {
      romsg.StallsInfo all = 1;
      romsg.StallsInfoIncrement inc = 2;
    }
  }

  message weekMoneyFieldIncrement {
    oneof value {
      romsg.LongLongPair all = 1;
      romsg.LongLongPairIncrement inc = 2;
    }
  }

  optional int64 lastAliveTime = 10;
  romsg.DBPlayerStallsInfoIncrement.infoFieldIncrement info = 20;
  romsg.DBPlayerStallsInfoIncrement.weekMoneyFieldIncrement weekMoney = 100;
}

message StallsBaseInfoIncrement {
  optional string stallsTitle = 10;
  optional int64 StallsID = 20;
  optional int64 SceneID = 30;
  optional int64 openTs = 40;
  optional int64 sceneEntryID = 50;
  optional int64 sceneLineNum = 60;
  optional int64 SystemStallID = 70;
}

message StallsInfoIncrement {
  message baseinfoFieldIncrement {
    oneof value {
      romsg.StallsBaseInfo all = 1;
      romsg.StallsBaseInfoIncrement inc = 2;
    }
  }

  message itembaseRepeatedOrigin {
    repeated romsg.StallsItemInfo value = 1;
  }

  message itembaseRepeatedIncrement {
    repeated romsg.StallsItemInfoIncrement value = 1;
  }

  message itembaseFieldIncrement {
    oneof value {
      romsg.StallsInfoIncrement.itembaseRepeatedOrigin all = 1;
      romsg.StallsInfoIncrement.itembaseRepeatedIncrement inc = 2;
    }
  }

  message allgainmoneyFieldIncrement {
    oneof value {
      int64 all = 1;
      int64 inc = 2;
      bool del = 3;
    }
  }

  message posFieldIncrement {
    oneof value {
      romsg.Vec3 all = 1;
      romsg.Vec3Increment inc = 2;
    }
  }

  message recordRepeatedOrigin {
    repeated romsg.StallsRecord value = 1;
  }

  message recordRepeatedIncrement {
    repeated romsg.StallsRecordIncrement value = 1;
  }

  message recordFieldIncrement {
    oneof value {
      romsg.StallsInfoIncrement.recordRepeatedOrigin all = 1;
      romsg.StallsInfoIncrement.recordRepeatedIncrement inc = 2;
    }
  }

  message curTaxFieldIncrement {
    oneof value {
      romsg.LongLongPair all = 1;
      romsg.LongLongPairIncrement inc = 2;
    }
  }

  romsg.StallsInfoIncrement.baseinfoFieldIncrement baseinfo = 10;
  romsg.StallsInfoIncrement.itembaseFieldIncrement itembase = 20;
  optional int64 timeout = 30;
  map<int32, romsg.StallsInfoIncrement.allgainmoneyFieldIncrement> allgainmoney = 40;
  romsg.StallsInfoIncrement.posFieldIncrement pos = 50;
  optional int32 maxgrid = 60;
  romsg.StallsInfoIncrement.recordFieldIncrement record = 70;
  optional bool bEnd = 80;
  optional int32 endMailid = 90;
  romsg.StallsInfoIncrement.curTaxFieldIncrement curTax = 100;
}

message StallsItemInfoIncrement {
  message itembaseFieldIncrement {
    oneof value {
      romsg.ItemBaseInfo all = 1;
      romsg.ItemBaseInfoIncrement inc = 2;
    }
  }

  optional int64 stallsItemID = 10;
  romsg.StallsItemInfoIncrement.itembaseFieldIncrement itembase = 20;
  optional int32 price = 30;
  optional int32 pricetype = 40;
  optional int64 systemStallCfgID = 50;
}

message StallsRecordIncrement {
  optional int64 itemEntryID = 10;
  optional int64 itemNum = 20;
  optional int64 buytime = 30;
  optional int64 tradetax = 40;
  optional int64 gainmoney = 50;
  optional int32 areaid = 60;
  optional int64 buyerid = 70;
  optional string buyername = 80;
  optional int64 coinEntryID = 90;
}

