syntax = "proto3";
package romsg;
import "MG_Common_Increment.proto";
import "MG_Common.proto";
import "MG_DB_Increment.proto";
import "MG_DB.proto";
import "MG_PublicServer.proto";

message DBClimbTowerFirstPassIncrement {
  message recordMapFieldIncrement {
    oneof value {
      romsg.FirstPassRecord all = 1;
      romsg.FirstPassRecordIncrement inc = 2;
      bool del = 3;
    }
  }

  map<int64, romsg.DBClimbTowerFirstPassIncrement.recordMapFieldIncrement> recordMap = 10;
}

message DBPresentInfoIncrement {
  message ordersFieldIncrement {
    oneof value {
      romsg.PresentOrderInfo all = 1;
      romsg.PresentOrderInfoIncrement inc = 2;
      bool del = 3;
    }
  }

  message receiverOrdersMapFieldIncrement {
    oneof value {
      romsg.ReceiverOrders all = 1;
      romsg.ReceiverOrdersIncrement inc = 2;
      bool del = 3;
    }
  }

  message senderOrdersMapFieldIncrement {
    oneof value {
      romsg.SenderOrders all = 1;
      romsg.SenderOrdersIncrement inc = 2;
      bool del = 3;
    }
  }

  map<int64, romsg.DBPresentInfoIncrement.ordersFieldIncrement> orders = 10;
  map<int64, romsg.DBPresentInfoIncrement.receiverOrdersMapFieldIncrement> receiverOrdersMap = 20;
  optional int64 nextOrderId = 30;
  map<int64, romsg.DBPresentInfoIncrement.senderOrdersMapFieldIncrement> senderOrdersMap = 40;
}

message DBPublicOnlineCountIncrement {
  message hourInfoFieldIncrement {
    oneof value {
      romsg.PublicOnlineHourInfo all = 1;
      romsg.PublicOnlineHourInfoIncrement inc = 2;
      bool del = 3;
    }
  }

  map<int64, romsg.DBPublicOnlineCountIncrement.hourInfoFieldIncrement> hourInfo = 10;
}

message DBPublicRestrictInfoIncrement {
  message restrictInfoMapFieldIncrement {
    oneof value {
      romsg.RestrictInfo all = 1;
      romsg.RestrictInfoIncrement inc = 2;
      bool del = 3;
    }
  }

  map<int32, romsg.DBPublicRestrictInfoIncrement.restrictInfoMapFieldIncrement> restrictInfoMap = 10;
}

message FirstPassRecordIncrement {
  optional int64 layer = 10;
  optional int64 playerId = 20;
  optional string playerName = 30;
  optional int64 passTime = 40;
  optional int64 recordTime = 50;
  optional int32 headImage = 60;
  optional int32 job = 70;
  optional int32 gender = 80;
}

message PresentOrderInfoIncrement {
  optional int64 orderId = 10;
  optional int64 senderId = 20;
  optional int64 receiverId = 30;
  optional int64 appranceId = 40;
  optional int64 appranceAwardId = 50;
  optional int64 currencyId = 60;
  optional int32 currencyCount = 70;
  optional int64 createTime = 80;
  optional romsg.EPresentOrderState state = 90;
  optional string giftContent = 100;
}

message PublicOnlineHourInfoIncrement {
  optional int64 hourId = 10;
  optional int64 maxOnlineNum = 20;
  optional int64 minOnlineNum = 30;
}

message ReceiverOrdersIncrement {
  message orderIdsRepeatedOrigin {
    repeated int64 value = 1;
  }

  message orderIdsRepeatedIncrement {
    repeated int64 value = 1;
  }

  message orderIdsFieldIncrement {
    oneof value {
      romsg.ReceiverOrdersIncrement.orderIdsRepeatedOrigin all = 1;
      romsg.ReceiverOrdersIncrement.orderIdsRepeatedIncrement inc = 2;
    }
  }

  romsg.ReceiverOrdersIncrement.orderIdsFieldIncrement orderIds = 10;
}

message RoleDetailInfoIncrement {
  message rolebaseFieldIncrement {
    oneof value {
      romsg.RolePublicBaseInfo all = 1;
      romsg.RolePublicBaseInfoIncrement inc = 2;
    }
  }

  message equipInfoFieldIncrement {
    oneof value {
      romsg.DBEquipInfo all = 1;
      romsg.DBEquipInfoIncrement inc = 2;
    }
  }

  message selfpropertyFieldIncrement {
    oneof value {
      romsg.AllProperty all = 1;
      romsg.AllPropertyIncrement inc = 2;
    }
  }

  romsg.RoleDetailInfoIncrement.rolebaseFieldIncrement rolebase = 10;
  romsg.RoleDetailInfoIncrement.equipInfoFieldIncrement equipInfo = 20;
  romsg.RoleDetailInfoIncrement.selfpropertyFieldIncrement selfproperty = 30;
}

message SenderOrdersIncrement {
  message orderIdsRepeatedOrigin {
    repeated int64 value = 1;
  }

  message orderIdsRepeatedIncrement {
    repeated int64 value = 1;
  }

  message orderIdsFieldIncrement {
    oneof value {
      romsg.SenderOrdersIncrement.orderIdsRepeatedOrigin all = 1;
      romsg.SenderOrdersIncrement.orderIdsRepeatedIncrement inc = 2;
    }
  }

  romsg.SenderOrdersIncrement.orderIdsFieldIncrement orderIds = 10;
}

