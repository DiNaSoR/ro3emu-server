syntax = "proto3";
package romsg;
import "MG_Pack.proto";

message AutoDecomposeSettingIncrement {
  message tabOptionSettingFieldIncrement {
    oneof value {
      romsg.ItemAutoDecomposeSettingReq all = 1;
      romsg.ItemAutoDecomposeSettingReqIncrement inc = 2;
      bool del = 3;
    }
  }

  map<int32, romsg.AutoDecomposeSettingIncrement.tabOptionSettingFieldIncrement> tabOptionSetting = 10;
}

message ItemAutoDecomposeSettingReqIncrement {
  message optionSettingFieldIncrement {
    oneof value {
      romsg.OptionGroup all = 1;
      romsg.OptionGroupIncrement inc = 2;
      bool del = 3;
    }
  }

  optional int32 tabId = 10;
  map<int32, romsg.ItemAutoDecomposeSettingReqIncrement.optionSettingFieldIncrement> optionSetting = 20;
  optional bool isOpen = 30;
}

message MedicinesAutoUseIncrement {
  message itemEntrysRepeatedOrigin {
    repeated int32 value = 1;
  }

  message itemEntrysRepeatedIncrement {
    repeated int32 value = 1;
  }

  message itemEntrysFieldIncrement {
    oneof value {
      romsg.MedicinesAutoUseIncrement.itemEntrysRepeatedOrigin all = 1;
      romsg.MedicinesAutoUseIncrement.itemEntrysRepeatedIncrement inc = 2;
    }
  }

  optional bool isOpen = 10;
  optional int32 condition = 20;
  romsg.MedicinesAutoUseIncrement.itemEntrysFieldIncrement itemEntrys = 30;
}

message MedicinesAutoUseSetIncrement {
  message hpConfigFieldIncrement {
    oneof value {
      romsg.MedicinesAutoUse all = 1;
      romsg.MedicinesAutoUseIncrement inc = 2;
    }
  }

  message spConfigFieldIncrement {
    oneof value {
      romsg.MedicinesAutoUse all = 1;
      romsg.MedicinesAutoUseIncrement inc = 2;
    }
  }

  romsg.MedicinesAutoUseSetIncrement.hpConfigFieldIncrement hpConfig = 10;
  romsg.MedicinesAutoUseSetIncrement.spConfigFieldIncrement spConfig = 20;
}

message OptionGroupIncrement {
  message optionsRepeatedOrigin {
    repeated int32 value = 1;
  }

  message optionsRepeatedIncrement {
    repeated int32 value = 1;
  }

  message optionsFieldIncrement {
    oneof value {
      romsg.OptionGroupIncrement.optionsRepeatedOrigin all = 1;
      romsg.OptionGroupIncrement.optionsRepeatedIncrement inc = 2;
    }
  }

  romsg.OptionGroupIncrement.optionsFieldIncrement options = 10;
}

message QuickUseSaveInfoIncrement {
  optional int32 lieQuickUse = 10;
  optional int32 itemEntry = 20;
}

message ShortcutBarInfoIncrement {
  optional int32 slotIndex = 10;
  optional int64 itemGuid = 20;
}

