syntax = "proto3";
package romsg;
import "MG_Chicken_Increment.proto";
import "MG_Chicken.proto";
import "MG_Common_Increment.proto";
import "MG_Common.proto";
import "MG_Dungeon.proto";

message RoundDungeonExtendInfoIncrement {
  message chickenDungeonInfoFieldIncrement {
    oneof value {
      romsg.ChickenDungeonInfo all = 1;
      romsg.ChickenDungeonInfoIncrement inc = 2;
    }
  }

  romsg.RoundDungeonExtendInfoIncrement.chickenDungeonInfoFieldIncrement chickenDungeonInfo = 10;
}

message RoundDungeonInfoIncrement {
  message teamMemberInfoFieldIncrement {
    oneof value {
      romsg.RoundTeamMemberInfo all = 1;
      romsg.RoundTeamMemberInfoIncrement inc = 2;
      bool del = 3;
    }
  }

  message itemCdExpireTimeFieldIncrement {
    oneof value {
      int64 all = 1;
      int64 inc = 2;
      bool del = 3;
    }
  }

  message extendInfoFieldIncrement {
    oneof value {
      romsg.RoundDungeonExtendInfo all = 1;
      romsg.RoundDungeonExtendInfoIncrement inc = 2;
    }
  }

  message packInfosFieldIncrement {
    oneof value {
      romsg.ItemBaseInfo all = 1;
      romsg.ItemBaseInfoIncrement inc = 2;
      bool del = 3;
    }
  }

  int64 version = 1;
  bool syncAllMark = 2;
  optional int64 teamId = 10;
  map<int64, romsg.RoundDungeonInfoIncrement.teamMemberInfoFieldIncrement> teamMemberInfo = 20;
  optional int32 careerId = 40;
  map<int32, romsg.RoundDungeonInfoIncrement.itemCdExpireTimeFieldIncrement> itemCdExpireTime = 50;
  romsg.RoundDungeonInfoIncrement.extendInfoFieldIncrement extendInfo = 60;
  optional int64 packWeight = 70;
  optional int32 freeRelifeCountLeft = 80;
  map<int64, romsg.RoundDungeonInfoIncrement.packInfosFieldIncrement> packInfos = 90;
}

message RoundTeamMemberInfoIncrement {
  message battleAttrFieldIncrement {
    oneof value {
      int64 all = 1;
      int64 inc = 2;
      bool del = 3;
    }
  }

  message posFieldIncrement {
    oneof value {
      romsg.Vec3 all = 1;
      romsg.Vec3Increment inc = 2;
    }
  }

  optional int64 memberGuid = 10;
  optional int32 career = 20;
  map<int32, romsg.RoundTeamMemberInfoIncrement.battleAttrFieldIncrement> battleAttr = 30;
  romsg.RoundTeamMemberInfoIncrement.posFieldIncrement pos = 40;
  optional romsg.RoundRoleStatus state = 50;
  optional int32 teamIndex = 60;
  optional int32 inAreaId = 70;
}

