syntax = "proto3";
package romsg;
import "MG_Common_Increment.proto";
import "MG_Common.proto";
import "MG_Team.proto";

message PlayerShieldInfoIncrement {
  optional int64 physicalShieldValue = 10;
  optional int64 magicShieldValue = 20;
  optional int64 commonShieldValue = 30;
  optional int64 extendedPartition1ShieldValue = 40;
}

message TeamMemberBattleInfoIncrement {
  message posFieldIncrement {
    oneof value {
      romsg.Vec3 all = 1;
      romsg.Vec3Increment inc = 2;
    }
  }

  message shieldInfoFieldIncrement {
    oneof value {
      romsg.PlayerShieldInfo all = 1;
      romsg.PlayerShieldInfoIncrement inc = 2;
    }
  }

  optional int32 hpPercent = 10;
  optional int32 mpPercent = 20;
  optional int64 battlePoint = 30;
  romsg.TeamMemberBattleInfoIncrement.posFieldIncrement pos = 40;
  optional int64 maxHpValue = 50;
  optional int64 maxMpValue = 60;
  romsg.TeamMemberBattleInfoIncrement.shieldInfoFieldIncrement shieldInfo = 70;
  optional romsg.EPlayerLifeStatus playerLifeStatus = 80;
}

