syntax = "proto3";
package romsg;
import "MG_Auction.proto";

message DBAuctionGoodRecordIncrement {
  message guildGenerateCountFieldIncrement {
    oneof value {
      int64 all = 1;
      int64 inc = 2;
      bool del = 3;
    }
  }

  optional int64 lastGenerateTime = 10;
  optional int64 lastSystemGenerateTime = 20;
  map<int64, romsg.DBAuctionGoodRecordIncrement.guildGenerateCountFieldIncrement> guildGenerateCount = 30;
  optional int64 generateTotalCount = 40;
  optional int64 systemGenerateCount = 50;
}

message DBAuctionItemIncrement {
  message bonusRoleIdsFieldIncrement {
    oneof value {
      bool all = 1;
      bool inc = 2;
      bool del = 3;
    }
  }

  message biddingRoleIdsFieldIncrement {
    oneof value {
      int64 all = 1;
      int64 inc = 2;
      bool del = 3;
    }
  }

  message autoBiddingsFieldIncrement {
    oneof value {
      romsg.DBAutoBidding all = 1;
      romsg.DBAutoBiddingIncrement inc = 2;
      bool del = 3;
    }
  }

  message curMaxAutoBiddingFieldIncrement {
    oneof value {
      romsg.DBAutoBidding all = 1;
      romsg.DBAutoBiddingIncrement inc = 2;
    }
  }

  message dungeonaucDataFieldIncrement {
    oneof value {
      romsg.DungeonAuctionData all = 1;
      romsg.DungeonAuctionDataIncrement inc = 2;
    }
  }

  message joinBiddingRoleIdsFieldIncrement {
    oneof value {
      int64 all = 1;
      int64 inc = 2;
      bool del = 3;
    }
  }

  optional int64 auctionId = 10;
  optional romsg.AuctionType auctionType = 20;
  optional int64 guildId = 30;
  optional int32 srcType = 40;
  optional int64 actId = 50;
  optional int64 actWeekDay = 60;
  optional int64 actDayStartTime = 70;
  optional int32 itemId = 80;
  optional int32 itemPrice = 90;
  optional int64 startTime = 100;
  optional int64 endTime = 110;
  optional romsg.AuctionState state = 120;
  optional int64 ownerId = 130;
  map<int64, romsg.DBAuctionItemIncrement.bonusRoleIdsFieldIncrement> bonusRoleIds = 140;
  map<int64, romsg.DBAuctionItemIncrement.biddingRoleIdsFieldIncrement> biddingRoleIds = 150;
  map<int64, romsg.DBAuctionItemIncrement.autoBiddingsFieldIncrement> autoBiddings = 160;
  romsg.DBAuctionItemIncrement.curMaxAutoBiddingFieldIncrement curMaxAutoBidding = 170;
  romsg.DBAuctionItemIncrement.dungeonaucDataFieldIncrement dungeonaucData = 180;
  optional int64 lastBiddingTime = 190;
  optional bool isEnterFastBidding = 200;
  map<int64, romsg.DBAuctionItemIncrement.joinBiddingRoleIdsFieldIncrement> joinBiddingRoleIds = 210;
  optional int64 GuildActivityId = 220;
  optional bytes strategyData = 230;
}

message DBAuctionRoleBonusIncrement {
  message groupBonusFieldIncrement {
    oneof value {
      romsg.DBBonus all = 1;
      romsg.DBBonusIncrement inc = 2;
      bool del = 3;
    }
  }

  optional int64 roleId = 10;
  map<string, romsg.DBAuctionRoleBonusIncrement.groupBonusFieldIncrement> groupBonus = 20;
}

message DBAuctionServerGlobalDataIncrement {
  message goodRecordsFieldIncrement {
    oneof value {
      romsg.DBAuctionGoodRecord all = 1;
      romsg.DBAuctionGoodRecordIncrement inc = 2;
      bool del = 3;
    }
  }

  message historyAuctionItemsFieldIncrement {
    oneof value {
      romsg.DBHistoryQueue all = 1;
      romsg.DBHistoryQueueIncrement inc = 2;
      bool del = 3;
    }
  }

  optional int64 areaId = 10;
  map<int64, romsg.DBAuctionServerGlobalDataIncrement.goodRecordsFieldIncrement> goodRecords = 20;
  map<int64, romsg.DBAuctionServerGlobalDataIncrement.historyAuctionItemsFieldIncrement> historyAuctionItems = 30;
}

message DBAutoBiddingIncrement {
  optional int64 roleId = 10;
  optional int32 maxPrice = 20;
  optional int64 biddingTime = 30;
  optional bool isPaused = 40;
}

message DBBonusIncrement {
  optional int32 bonus = 10;
  optional int64 guildId = 20;
  optional int64 actId = 30;
  optional int64 actWeekDay = 40;
  optional int64 actDayStartTime = 50;
  optional romsg.GroupBonusState state = 60;
}

message DBGuildAuctionActBonusIncrement {
  message auctionItemBonusesFieldIncrement {
    oneof value {
      int32 all = 1;
      int32 inc = 2;
      bool del = 3;
    }
  }

  message bonusPlayerRatiosFieldIncrement {
    oneof value {
      int64 all = 1;
      int64 inc = 2;
      bool del = 3;
    }
  }

  message currencyBonusFieldIncrement {
    oneof value {
      int64 all = 1;
      int64 inc = 2;
      bool del = 3;
    }
  }

  map<int64, romsg.DBGuildAuctionActBonusIncrement.auctionItemBonusesFieldIncrement> auctionItemBonuses = 20;
  optional int64 expireTs = 30;
  optional bool hasBidding = 40;
  map<int64, romsg.DBGuildAuctionActBonusIncrement.bonusPlayerRatiosFieldIncrement> bonusPlayerRatios = 50;
  map<int64, romsg.DBGuildAuctionActBonusIncrement.currencyBonusFieldIncrement> currencyBonus = 60;
}

message DBGuildAuctionBonusIncrement {
  message actBonusesFieldIncrement {
    oneof value {
      romsg.DBGuildAuctionActBonus all = 1;
      romsg.DBGuildAuctionActBonusIncrement inc = 2;
      bool del = 3;
    }
  }

  optional int64 guildId = 10;
  map<int64, romsg.DBGuildAuctionBonusIncrement.actBonusesFieldIncrement> actBonuses = 30;
}

message DBHistoryQueueIncrement {
  message historyFieldIncrement {
    oneof value {
      romsg.HistoryAuctionItem all = 1;
      romsg.HistoryAuctionItemIncrement inc = 2;
    }
  }

  message roleIdsRepeatedOrigin {
    repeated int64 value = 1;
  }

  message roleIdsRepeatedIncrement {
    repeated int64 value = 1;
  }

  message roleIdsFieldIncrement {
    oneof value {
      romsg.DBHistoryQueueIncrement.roleIdsRepeatedOrigin all = 1;
      romsg.DBHistoryQueueIncrement.roleIdsRepeatedIncrement inc = 2;
    }
  }

  romsg.DBHistoryQueueIncrement.historyFieldIncrement history = 10;
  romsg.DBHistoryQueueIncrement.roleIdsFieldIncrement roleIds = 20;
}

message DungeonAuctionDataIncrement {
  message cantbonusRoleIdsRepeatedOrigin {
    repeated int64 value = 1;
  }

  message cantbonusRoleIdsRepeatedIncrement {
    repeated int64 value = 1;
  }

  message cantbonusRoleIdsFieldIncrement {
    oneof value {
      romsg.DungeonAuctionDataIncrement.cantbonusRoleIdsRepeatedOrigin all = 1;
      romsg.DungeonAuctionDataIncrement.cantbonusRoleIdsRepeatedIncrement inc = 2;
    }
  }

  message giveupUsersRepeatedOrigin {
    repeated int64 value = 1;
  }

  message giveupUsersRepeatedIncrement {
    repeated int64 value = 1;
  }

  message giveupUsersFieldIncrement {
    oneof value {
      romsg.DungeonAuctionDataIncrement.giveupUsersRepeatedOrigin all = 1;
      romsg.DungeonAuctionDataIncrement.giveupUsersRepeatedIncrement inc = 2;
    }
  }

  optional int64 dungeonBeginTime = 10;
  romsg.DungeonAuctionDataIncrement.cantbonusRoleIdsFieldIncrement cantbonusRoleIds = 20;
  optional int64 quUniqueId = 30;
  romsg.DungeonAuctionDataIncrement.giveupUsersFieldIncrement giveupUsers = 40;
  optional bool preBidding = 50;
}

message DungeonAuctionQueueIncrement {
  message dungeonQueueFieldIncrement {
    oneof value {
      romsg.RealQueue all = 1;
      romsg.RealQueueIncrement inc = 2;
      bool del = 3;
    }
  }

  map<int64, romsg.DungeonAuctionQueueIncrement.dungeonQueueFieldIncrement> dungeonQueue = 10;
}

message HistoryAuctionItemIncrement {
  optional int32 itemId = 10;
  optional int32 itemPrice = 20;
  optional int64 endTime = 30;
  optional int32 srcType = 40;
  optional int64 userId = 50;
  optional int64 auctionId = 60;
  optional int64 auctionType = 70;
}

message RealQueueIncrement {
  message auctionIdRepeatedOrigin {
    repeated int64 value = 1;
  }

  message auctionIdRepeatedIncrement {
    repeated int64 value = 1;
  }

  message auctionIdFieldIncrement {
    oneof value {
      romsg.RealQueueIncrement.auctionIdRepeatedOrigin all = 1;
      romsg.RealQueueIncrement.auctionIdRepeatedIncrement inc = 2;
    }
  }

  romsg.RealQueueIncrement.auctionIdFieldIncrement auctionId = 10;
}

