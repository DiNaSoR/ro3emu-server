syntax = "proto3";
package romsg;
import "MG_Common.proto";

message ResourceOperate {
  repeated romsg.ItemBaseInfo item = 1;
  int64 tarPlayerId = 2;
}

message ActionOneStep {
  string actionName = 1;
  repeated romsg.ResourceOperate resourceOperate = 2;
  string checkParam = 3;
}

message SaleTransAction {
  int64 ro3Define_SaveVersion = 9999;
  int64 ro3Define_DbTerm = 10000;
  romsg.TransAction transaction = 1;
}

message BuyTransAction {
  int64 ro3Define_SaveVersion = 9999;
  int64 ro3Define_DbTerm = 10000;
  romsg.TransAction transaction = 1;
}

message TransAction {
  string transActionId = 1;
  string name = 2;
  repeated romsg.ActionOneStep steps = 3;
  int64 ownerRoleID = 4;
}

