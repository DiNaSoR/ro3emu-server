syntax = "proto3";
package romsg;

message PetDataIncrement {
  message breakLvFieldIncrement {
    oneof value {
      int64 all = 1;
      int64 inc = 2;
      bool del = 3;
    }
  }

  optional int32 petId = 10;
  optional int32 level = 20;
  optional int32 star = 30;
  optional int32 starProgress = 40;
  optional int64 levelExp = 50;
  map<int64, romsg.PetDataIncrement.breakLvFieldIncrement> breakLv = 60;
  optional bool isActiveCollect = 70;
}

