syntax = "proto3";
package romsg;
import "MG_AdventureGroup.proto";
import "MG_Season_Increment.proto";
import "MG_Season.proto";

message AdventureGroupBaseInfoIncrement {
  message labelRepeatedOrigin {
    repeated int32 value = 1;
  }

  message labelRepeatedIncrement {
    repeated int32 value = 1;
  }

  message labelFieldIncrement {
    oneof value {
      romsg.AdventureGroupBaseInfoIncrement.labelRepeatedOrigin all = 1;
      romsg.AdventureGroupBaseInfoIncrement.labelRepeatedIncrement inc = 2;
    }
  }

  message saplingDataFieldIncrement {
    oneof value {
      romsg.SaplingData all = 1;
      romsg.SaplingDataIncrement inc = 2;
    }
  }

  message resourceDataFieldIncrement {
    oneof value {
      romsg.Resource all = 1;
      romsg.ResourceIncrement inc = 2;
    }
  }

  message conveneDataFieldIncrement {
    oneof value {
      romsg.ConveneData all = 1;
      romsg.ConveneDataIncrement inc = 2;
    }
  }

  message availablebackgroundRepeatedOrigin {
    repeated int32 value = 1;
  }

  message availablebackgroundRepeatedIncrement {
    repeated int32 value = 1;
  }

  message availablebackgroundFieldIncrement {
    oneof value {
      romsg.AdventureGroupBaseInfoIncrement.availablebackgroundRepeatedOrigin all = 1;
      romsg.AdventureGroupBaseInfoIncrement.availablebackgroundRepeatedIncrement inc = 2;
    }
  }

  message seasonStateFieldIncrement {
    oneof value {
      romsg.SeasonState all = 1;
      romsg.SeasonStateIncrement inc = 2;
    }
  }

  optional string name = 10;
  optional int32 level = 20;
  optional string announce = 30;
  optional int32 createTime = 40;
  optional int32 status = 50;
  romsg.AdventureGroupBaseInfoIncrement.labelFieldIncrement label = 60;
  optional bool autoAgreeHelperApply = 70;
  optional int32 background = 80;
  optional int64 owner = 90;
  optional bool autoAgreeApply = 100;
  optional int32 recruitTime = 110;
  optional int32 changeOwnerTime = 120;
  optional string chatGroupid = 130;
  optional bool canSeeMemberAnnounce = 140;
  optional romsg.AdventureGroupCreateType createType = 150;
  romsg.AdventureGroupBaseInfoIncrement.saplingDataFieldIncrement saplingData = 160;
  romsg.AdventureGroupBaseInfoIncrement.resourceDataFieldIncrement resourceData = 170;
  optional int32 weekResetTime = 180;
  optional int32 dayResetTime = 190;
  romsg.AdventureGroupBaseInfoIncrement.conveneDataFieldIncrement conveneData = 200;
  romsg.AdventureGroupBaseInfoIncrement.availablebackgroundFieldIncrement availablebackground = 210;
  romsg.AdventureGroupBaseInfoIncrement.seasonStateFieldIncrement seasonState = 220;
  optional int32 lastUpdateTime = 230;
}

message ConveneDataIncrement {
  optional int32 useTime = 10;
  optional int32 lastConveneTime = 20;
}

message DBAdventureGroupDataIncrement {
  message baseDataFieldIncrement {
    oneof value {
      romsg.AdventureGroupBaseInfo all = 1;
      romsg.AdventureGroupBaseInfoIncrement inc = 2;
    }
  }

  message memberDataRepeatedOrigin {
    repeated romsg.PlayerBaseInfo value = 1;
  }

  message memberDataRepeatedIncrement {
    repeated romsg.PlayerBaseInfoIncrement value = 1;
  }

  message memberDataFieldIncrement {
    oneof value {
      romsg.DBAdventureGroupDataIncrement.memberDataRepeatedOrigin all = 1;
      romsg.DBAdventureGroupDataIncrement.memberDataRepeatedIncrement inc = 2;
    }
  }

  message applyDataRepeatedOrigin {
    repeated romsg.PlayerBaseInfo value = 1;
  }

  message applyDataRepeatedIncrement {
    repeated romsg.PlayerBaseInfoIncrement value = 1;
  }

  message applyDataFieldIncrement {
    oneof value {
      romsg.DBAdventureGroupDataIncrement.applyDataRepeatedOrigin all = 1;
      romsg.DBAdventureGroupDataIncrement.applyDataRepeatedIncrement inc = 2;
    }
  }

  message eventDataRepeatedOrigin {
    repeated romsg.EventData value = 1;
  }

  message eventDataRepeatedIncrement {
    repeated romsg.EventDataIncrement value = 1;
  }

  message eventDataFieldIncrement {
    oneof value {
      romsg.DBAdventureGroupDataIncrement.eventDataRepeatedOrigin all = 1;
      romsg.DBAdventureGroupDataIncrement.eventDataRepeatedIncrement inc = 2;
    }
  }

  optional int64 uuid = 10;
  optional int32 bornAreaId = 20;
  romsg.DBAdventureGroupDataIncrement.baseDataFieldIncrement baseData = 30;
  romsg.DBAdventureGroupDataIncrement.memberDataFieldIncrement memberData = 40;
  romsg.DBAdventureGroupDataIncrement.applyDataFieldIncrement applyData = 50;
  romsg.DBAdventureGroupDataIncrement.eventDataFieldIncrement eventData = 70;
}

message DeclarationInfoIncrement {
  optional string content = 10;
  optional romsg.DeclarationType declarationType = 20;
  optional bytes voice = 30;
  optional int32 voiceDuration = 40;
}

message EventDataIncrement {
  optional romsg.AdventureGroupEventType eventType = 10;
  optional int32 eventTime = 20;
  optional int64 eventFirstParam = 30;
  optional int64 eventSecondParam = 40;
  optional string eventThirdParam = 50;
}

message PlayerBaseInfoIncrement {
  message declarationDataFieldIncrement {
    oneof value {
      romsg.DeclarationInfo all = 1;
      romsg.DeclarationInfoIncrement inc = 2;
    }
  }

  optional int64 playerID = 10;
  optional int32 enterTime = 20;
  optional int32 bornAreaId = 30;
  optional int32 offTime = 40;
  optional string nickname = 50;
  romsg.PlayerBaseInfoIncrement.declarationDataFieldIncrement declarationData = 60;
  optional int32 wateringCount = 70;
  optional string userName = 80;
}

message ResourceIncrement {
  optional int64 adventGroupMoney = 10;
  optional int32 weekMoney = 20;
}

message SaplingDataIncrement {
  optional int32 saplingId = 10;
  optional int32 wateringCount = 20;
  optional int32 upvoteCount = 30;
}

