syntax = "proto3";
package romsg;
import "MG_Match.proto";

message ChickenMatchDataIncrement {
  message playerGuidsRepeatedOrigin {
    repeated int64 value = 1;
  }

  message playerGuidsRepeatedIncrement {
    repeated int64 value = 1;
  }

  message playerGuidsFieldIncrement {
    oneof value {
      romsg.ChickenMatchDataIncrement.playerGuidsRepeatedOrigin all = 1;
      romsg.ChickenMatchDataIncrement.playerGuidsRepeatedIncrement inc = 2;
    }
  }

  optional int64 ownerId = 10;
  romsg.ChickenMatchDataIncrement.playerGuidsFieldIncrement playerGuids = 20;
  optional int32 score = 30;
  optional bool isFirstChicken = 40;
}

message MatchDataIncrement {
  message chickenFieldIncrement {
    oneof value {
      romsg.ChickenMatchData all = 1;
      romsg.ChickenMatchDataIncrement inc = 2;
    }
  }

  message multiDungeonFieldIncrement {
    oneof value {
      romsg.MultiDungeonMatchData all = 1;
      romsg.MultiDungeonMatchDataIncrement inc = 2;
    }
  }

  romsg.MatchDataIncrement.chickenFieldIncrement chicken = 10;
  romsg.MatchDataIncrement.multiDungeonFieldIncrement multiDungeon = 20;
  optional int64 matchEntryId = 30;
}

message MatchPenaltyDataIncrement {
  optional int64 count = 10;
  optional int64 unlockTime = 20;
  optional int64 remainingPunishTime = 30;
}

message MultiDungeonMatchDataIncrement {
  optional int64 dungeonId = 10;
  optional int64 multiDungeonId = 20;
  optional int64 markId = 30;
}

