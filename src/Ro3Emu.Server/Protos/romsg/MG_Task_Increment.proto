syntax = "proto3";
package romsg;
import "MG_Task.proto";

message TaskInfoIncrement {
  message completeNumRepeatedOrigin {
    repeated int64 value = 1;
  }

  message completeNumRepeatedIncrement {
    repeated int64 value = 1;
  }

  message completeNumFieldIncrement {
    oneof value {
      romsg.TaskInfoIncrement.completeNumRepeatedOrigin all = 1;
      romsg.TaskInfoIncrement.completeNumRepeatedIncrement inc = 2;
    }
  }

  optional int64 taskId = 10;
  optional romsg.TaskState status = 20;
  romsg.TaskInfoIncrement.completeNumFieldIncrement completeNum = 30;
  optional int64 startTime = 40;
  optional bool follow = 50;
  optional int64 limitStartTime = 60;
  optional bool isChapterLocked = 70;
}

