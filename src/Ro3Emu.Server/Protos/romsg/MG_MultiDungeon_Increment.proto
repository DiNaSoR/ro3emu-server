syntax = "proto3";
package romsg;
import "MG_DB_Increment.proto";
import "MG_DB.proto";
import "MG_MultiDungeon.proto";
import "MG_PublicServer_Increment.proto";
import "MG_PublicServer.proto";

message DBMultiDungeonHallOfFameIncrement {
  message roleInfoRepeatedOrigin {
    repeated romsg.RoleDetailInfo value = 1;
  }

  message roleInfoRepeatedIncrement {
    repeated romsg.RoleDetailInfoIncrement value = 1;
  }

  message roleInfoFieldIncrement {
    oneof value {
      romsg.DBMultiDungeonHallOfFameIncrement.roleInfoRepeatedOrigin all = 1;
      romsg.DBMultiDungeonHallOfFameIncrement.roleInfoRepeatedIncrement inc = 2;
    }
  }

  optional int32 multiDungeonBossId = 10;
  optional int32 passTime = 20;
  romsg.DBMultiDungeonHallOfFameIncrement.roleInfoFieldIncrement roleInfo = 30;
  optional int64 passTimestamp = 40;
  optional string teamLeaderName = 50;
  optional int64 teamLeaderId = 60;
}

message DBMultiDungeonServerInfoIncrement {
  message fivePeakChallengeBossIdsRepeatedOrigin {
    repeated int32 value = 1;
  }

  message fivePeakChallengeBossIdsRepeatedIncrement {
    repeated int32 value = 1;
  }

  message fivePeakChallengeBossIdsFieldIncrement {
    oneof value {
      romsg.DBMultiDungeonServerInfoIncrement.fivePeakChallengeBossIdsRepeatedOrigin all = 1;
      romsg.DBMultiDungeonServerInfoIncrement.fivePeakChallengeBossIdsRepeatedIncrement inc = 2;
    }
  }

  message difficultBuffBossIdsRepeatedOrigin {
    repeated int32 value = 1;
  }

  message difficultBuffBossIdsRepeatedIncrement {
    repeated int32 value = 1;
  }

  message difficultBuffBossIdsFieldIncrement {
    oneof value {
      romsg.DBMultiDungeonServerInfoIncrement.difficultBuffBossIdsRepeatedOrigin all = 1;
      romsg.DBMultiDungeonServerInfoIncrement.difficultBuffBossIdsRepeatedIncrement inc = 2;
    }
  }

  message hallOfFameFieldIncrement {
    oneof value {
      romsg.DBMultiDungeonHallOfFame all = 1;
      romsg.DBMultiDungeonHallOfFameIncrement inc = 2;
      bool del = 3;
    }
  }

  message firstBroadCastFieldIncrement {
    oneof value {
      bool all = 1;
      bool inc = 2;
      bool del = 3;
    }
  }

  message sacredBlessingsFieldIncrement {
    oneof value {
      romsg.DBMultiDungeonSacredBlessings all = 1;
      romsg.DBMultiDungeonSacredBlessingsIncrement inc = 2;
      bool del = 3;
    }
  }

  message fiveDungeonMaxMarkFieldIncrement {
    oneof value {
      int32 all = 1;
      int32 inc = 2;
      bool del = 3;
    }
  }

  message gveDifficultyPassTimeFieldIncrement {
    oneof value {
      int32 all = 1;
      int32 inc = 2;
      bool del = 3;
    }
  }

  optional int32 week = 10;
  romsg.DBMultiDungeonServerInfoIncrement.fivePeakChallengeBossIdsFieldIncrement fivePeakChallengeBossIds = 20;
  romsg.DBMultiDungeonServerInfoIncrement.difficultBuffBossIdsFieldIncrement difficultBuffBossIds = 30;
  map<int32, romsg.DBMultiDungeonServerInfoIncrement.hallOfFameFieldIncrement> hallOfFame = 60;
  map<int32, romsg.DBMultiDungeonServerInfoIncrement.firstBroadCastFieldIncrement> firstBroadCast = 70;
  map<int32, romsg.DBMultiDungeonServerInfoIncrement.sacredBlessingsFieldIncrement> sacredBlessings = 80;
  map<int32, romsg.DBMultiDungeonServerInfoIncrement.fiveDungeonMaxMarkFieldIncrement> fiveDungeonMaxMark = 90;
  map<int32, romsg.DBMultiDungeonServerInfoIncrement.gveDifficultyPassTimeFieldIncrement> gveDifficultyPassTime = 100;
}

