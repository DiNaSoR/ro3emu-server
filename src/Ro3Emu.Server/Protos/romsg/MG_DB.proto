message DBTest_Node {
  int64 node_n1_int = 1;
  string node_s2_str = 2;
  oneof n3_oneof {
    int32 node_oneofn3_n1_int = 3;
    int32 node_oneofn3_n2_int = 4;
    int32 node_oneofn3_n3_int = 5;
  }
  repeated int32 node_n4_repeated_int = 6;
  map<int32, string> node_n5_map_string = 7;
}

message DBTest_Layer4 {
  string l4_s1_str = 1;
  romsg.DBTest_Node l4_n1_node = 2;
  repeated romsg.DBTest_Node l4_n2_repeated_node = 3;
  map<int32, romsg.DBTest_Node> l4_n3_map_node = 4;
  oneof n4_oneof {
    int32 l4_oneofn4_n1_int = 5;
    romsg.DBTest_Node l4_oneofn4_n2_node = 6;
  }
  oneof n5_oneof {
    romsg.DBTest_Node l4_oneofn5_n1_node = 8;
    romsg.DBTest_Node l4_oneofn5_n2_node = 9;
    romsg.DBTest_Node l4_oneofn5_n3_node = 10;
  }
  romsg.DBTest_Node l4_n6 = 11;
}

message DBTest_Layer3 {
  string l3_s1_str = 1;
  romsg.DBTest_Node l3_n1_node = 2;
  repeated romsg.DBTest_Layer4 l3_n2_repeated_layer4 = 3;
  map<int32, romsg.DBTest_Layer4> l3_n3_map_layer4 = 4;
  oneof n4_oneof {
    int32 l3_oneofn4_n1_int = 5;
    int32 l3_oneofn4_n2_int = 6;
  }
  oneof n5_oneof {
    romsg.DBTest_Node l3_oneofn5_n1_node = 8;
    romsg.DBTest_Layer4 l3_oneofn5_n2_layer4 = 9;
    romsg.DBTest_Layer4 l3_oneofn5_n3_layer4 = 10;
  }
  romsg.DBTest_Layer4 l3_n6_layer4 = 11;
}

message DBTest_Layer2 {
  string l2_s1_str = 1;
  romsg.DBTest_Node l2_n1_node = 2;
  repeated romsg.DBTest_Layer3 l2_n2_repeated_layer3 = 3;
  map<int32, romsg.DBTest_Layer3> l2_n3_map_layer3 = 4;
  oneof n4_oneof {
    int32 l2_oneofn4_n1_int = 5;
    int32 l2_oneofn4_n2_int = 6;
  }
  oneof n5_oneof {
    romsg.DBTest_Node l2_oneofn5_n1_node = 8;
    romsg.DBTest_Layer3 l2_oneofn5_n2_layer3 = 9;
    romsg.DBTest_Layer3 l2_oneofn5_n3_layer3 = 10;
  }
  romsg.DBTest_Layer3 l2_n6_layer3 = 11;
}

message DBTest_Layer1 {
  string l1_s1_str = 1;
  romsg.DBTest_Node l1_n1_node = 2;
  repeated romsg.DBTest_Layer2 l1_n2_repeated_Layer2 = 3;
