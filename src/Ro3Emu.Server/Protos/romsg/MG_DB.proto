  oneof n4_oneof {
    int32 l1_oneofn4_n1_int = 5;
    int32 l1_oneofn4_n2_int = 6;
  }
  oneof n5_oneof {
    romsg.DBTest_Node l1_oneofn5_n1_node = 8;
