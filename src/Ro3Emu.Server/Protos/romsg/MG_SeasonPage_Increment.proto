syntax = "proto3";
package romsg;

message FunctionListIncrement {
  message functionsRepeatedOrigin {
    repeated int32 value = 1;
  }

  message functionsRepeatedIncrement {
    repeated int32 value = 1;
  }

  message functionsFieldIncrement {
    oneof value {
      romsg.FunctionListIncrement.functionsRepeatedOrigin all = 1;
      romsg.FunctionListIncrement.functionsRepeatedIncrement inc = 2;
    }
  }

  romsg.FunctionListIncrement.functionsFieldIncrement functions = 10;
}

message SeasonPageHistoryFunctionScoreDataIncrement {
  message functionScoreFieldIncrement {
    oneof value {
      int64 all = 1;
      int64 inc = 2;
      bool del = 3;
    }
  }

  map<int64, romsg.SeasonPageHistoryFunctionScoreDataIncrement.functionScoreFieldIncrement> functionScore = 10;
}

message SeasonPageHonorBadgeDataIncrement {
  optional int64 id = 10;
  optional int64 getTime = 20;
  optional int64 getSeasonId = 30;
  optional int64 getPlayBookId = 40;
  optional bool isPutOn = 50;
}

