syntax = "proto3";
package romsg;
import "MG_SeasonPage_Increment.proto";
import "MG_SeasonPage.proto";

message SeasonPageExternalDataIncrement {
  message honorBadgeDataFieldIncrement {
    oneof value {
      romsg.SeasonPageHonorBadgeData all = 1;
      romsg.SeasonPageHonorBadgeDataIncrement inc = 2;
      bool del = 3;
    }
  }

  message currentFieldIncrement {
    oneof value {
      romsg.SeasonPageHistoryFunctionScoreData all = 1;
      romsg.SeasonPageHistoryFunctionScoreDataIncrement inc = 2;
    }
  }

  message historyFieldIncrement {
    oneof value {
      romsg.SeasonPageHistoryFunctionScoreData all = 1;
      romsg.SeasonPageHistoryFunctionScoreDataIncrement inc = 2;
    }
  }

  map<int64, romsg.SeasonPageExternalDataIncrement.honorBadgeDataFieldIncrement> honorBadgeData = 10;
  romsg.SeasonPageExternalDataIncrement.currentFieldIncrement current = 20;
  romsg.SeasonPageExternalDataIncrement.historyFieldIncrement history = 30;
}

