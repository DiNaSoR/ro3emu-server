name: Client-independent .NET checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The SDK feature band fixes the formatter: other bands lay out some statements differently. global.json only
      # sets the lowest SDK that builds the code, so the band is chosen here; move it in every workflow at once.
      - uses: actions/setup-dotnet@v6
        id: dotnet
        with:
          dotnet-version: 10.0.4xx
      # global.json only sets the lowest SDK; pin the one installed above so a newer band on the runner
      # cannot change the formatter or analyzers.
      - name: Pin the SDK
        run: dotnet new globaljson --sdk-version ${{ steps.dotnet.outputs.dotnet-version }} --force
      # Layout rules are in .editorconfig. Fix locally with: dotnet format whitespace --folder
      - name: Check C# layout
        run: dotnet format whitespace --folder --verify-no-changes

  # Rebuilds everything that builds without the client with the baseline rules as warnings, and fails when a rule's
  # count no longer matches the one in .editorconfig (tools/AnalyzerBaseline).
  analyzer-baseline:
    name: Analyzer baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        id: dotnet
        with:
          dotnet-version: 10.0.4xx
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj
      # global.json only sets the lowest SDK; pin the one installed above so a newer band on the runner
      # cannot change the formatter or analyzers.
      - name: Pin the SDK
        run: dotnet new globaljson --sdk-version ${{ steps.dotnet.outputs.dotnet-version }} --force
      - name: Check the analyzer baseline
        run: dotnet run --project tools/AnalyzerBaseline -c Release

  # The server, the setup tool and the patcher are built and tested on Linux and Windows by tests.yml; this job
  # builds what no test project references.
  build:
    name: Export tools and launcher build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        id: dotnet
        with:
          dotnet-version: 10.0.4xx
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj
      # global.json only sets the lowest SDK; pin the one installed above so a newer band on the runner
      # cannot change the formatter or analyzers.
      - name: Pin the SDK
        run: dotnet new globaljson --sdk-version ${{ steps.dotnet.outputs.dotnet-version }} --force
      # Compiler and analyzer warnings are errors (Directory.Build.props); warnings of MSBuild tasks such as protoc
      # are not.
      - name: Build export tools, bot CLI and launcher
        run: |
          foreach ($project in 'tools/LuaDecode', 'tools/ConfigExport', 'tools/ProtoDump', 'src/Ro3Emu.BotCli', 'src/Ro3Emu.Launcher') {
            dotnet build $project -c Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        shell: pwsh
