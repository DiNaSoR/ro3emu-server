name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Server tests
        run: dotnet test tests/Ro3Emu.Tests -c Release --filter "Category!=Slow"
      - name: Patcher tests
        run: dotnet test tests/Ro3Emu.Patcher.Tests -c Release
